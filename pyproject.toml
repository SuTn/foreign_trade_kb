[project]
name = "foreign-trade-kb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "playwright>=1.42",
    "chromadb>=0.4.22",
    "langchain>=0.1.10",
    "langchain-community>=0.0.25",
    "anthropic>=0.21",
    "openai>=1.14",
    "pypdfium2>=4.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "FlagEmbedding>=1.2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
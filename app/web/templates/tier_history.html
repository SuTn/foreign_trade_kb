{% if history %}
<ul class="tier-timeline">
  {% for h in history %}
  <li>
    <span class="tier-badge tier-{{ h['intent_level'] }}">{{ h['intent_level'] }}</span>
    <span class="tag">{{ h['tags'] }}</span>
    <span class="muted">({{ h['source'] }}, {{ h['created_at'] }})</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">暂无分层历史</p>
{% endif %}

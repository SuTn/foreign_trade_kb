{% extends "base.html" %}
{% block title %}客户工作台{% endblock %}
{% block content %}
<div class="workspace">
  <aside class="ws-left">
    <div class="ws-left-header">
      <h2>客户</h2>
      <input id="ws-search" class="input" type="text" placeholder="搜索客户...">
      <select id="ws-tier" class="input ws-tier-select">
        <option value="">全部等级</option>
        <option value="A">A · 高意向</option>
        <option value="B">B · 中意向</option>
        <option value="C">C · 低意向</option>
        <option value="D">D · 观望</option>
        <option value="untiered">未分层</option>
      </select>
    </div>
    <div class="ws-customer-list" id="ws-customer-list">
      {% include "workspace_customers.html" %}
    </div>
  </aside>
  <section class="ws-center" id="ws-center">
    <div class="ws-placeholder">← 选择左侧客户查看聊天</div>
  </section>
  <aside class="ws-right" id="ws-right">
    <div class="ws-placeholder">选择客户后显示画像与 AI 建议</div>
  </aside>
</div>
<script>
// workspace-deeplink: 支持 ?customer_id= 深链 — 页面加载后自动选中并加载该客户
(function () {
  function loadFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var cid = params.get("customer_id");
    if (!cid) return;
    var row = document.querySelector('.ws-customer[data-cid="' + cid + '"]');
    if (!row) return;
    // 触发 htmx 加载中栏 (与点击客户行为一致)
    if (window.htmx) htmx.trigger(row, "click");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadFromUrl);
  } else {
    loadFromUrl();
  }
})();
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h1 class="page-title">数据清理</h1>
<p class="page-sub">删除不可恢复! 仅清理聊天消息 (含向量), 画像与知识库不受影响。</p>
<div class="two-col">
  <section class="result-card">
    <h2>按会话清理</h2>
    <p class="muted">选择要清理的会话，删除该会话的全部消息。</p>
    <form hx-post="/api/cleanup"
          hx-confirm="确认删除该会话全部消息? 删除不可恢复!"
          hx-target="#cleanup-result" hx-swap="innerHTML">
      <input type="hidden" name="mode" value="chat">
      <select class="input" name="chat_id" required style="width:100%">
        <option value="">选择会话…</option>
        {% for c in chats %}
        <option value="{{ c['id'] }}">{{ c['display_name'] or c['id'] }}{% if c['customer_name'] %} · {{ c['customer_name'] }}{% endif %}</option>
        {% endfor %}
      </select>
      <button class="btn btn-danger" type="submit" style="margin-top:8px">删除该会话消息</button>
    </form>
  </section>
  <section class="result-card">
    <h2>按天数清理</h2>
    <p class="muted">删除 N 天前的全部消息（保留最近 N 天）。</p>
    <form hx-post="/api/cleanup"
          hx-confirm="确认删除 N 天前的全部消息? 删除不可恢复!"
          hx-target="#cleanup-result" hx-swap="innerHTML">
      <input type="hidden" name="mode" value="days">
      <input class="input" name="days" type="number" min="1" placeholder="天数 (删除该天数前的消息)" style="width:100%">
      <button class="btn btn-danger" type="submit" style="margin-top:8px">删除 N 天前消息</button>
    </form>
  </section>
</div>
<div id="cleanup-result"></div>
{% endblock %}

{% for m in messages %}
<div class="chat-row {{ 'mine' if m.from_me else 'theirs' }}" data-ts="{{ m.ts }}" data-msg-id="{{ m.id }}">
  <div class="chat-bubble {{ 'mine' if m.from_me else 'theirs' }}">
    <div class="chat-meta">{% if kind == 'group' %}{{ '我' if m.from_me else (m.sender_name or '未知') }} · {{ m.ts|ws_time }}{% else %}{{ '我' if m.from_me else '客户' }} · {{ m.ts|ws_time }}{% endif %}</div>
    <div class="chat-text">{{ m.body or '(无正文)' }}</div>
  </div>
</div>
{% endfor %}
{% if has_more %}
<div id="ws-load-earlier-wrap">
  <button class="ws-load-earlier" hx-get="/workspace/customer/{{ customer_id }}/chat/earlier?before_ts={{ oldest_ts }}&chat_id={{ chat_id }}"
          hx-target="#ws-load-earlier-wrap" hx-swap="outerHTML">加载更早消息</button>
</div>
{% endif %}
